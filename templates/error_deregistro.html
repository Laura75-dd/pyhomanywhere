<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo|default:"Lo sentimos mucho" }}</title>
    <!-- Incluye Tailwind desde CDN para el diseño rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full text-center border border-gray-100">
        <!-- Icono de información/disculpa (Naranja suave) -->
        <div class="flex justify-center mb-5">
            <svg class="h-16 w-16 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        
        <!-- Título dinámico amable -->
        <h1 class="text-2xl font-bold text-gray-800 mb-3">
            {{ titulo|default:"¡Upps! Lo sentimos mucho..." }}
        </h1>
        
        <!-- Mensaje dinámico amable -->
        <p class="text-gray-600 mb-8 leading-relaxed">
            {{ mensaje|default:"Ha ocurrido un pequeño inconveniente y no pudimos completar tu solicitud. Por favor, te invitamos a realizar tu registro nuevamente." }}
        </p>
        
        <!-- Botón para regresar a intentar -->
        <button onclick="window.history.back()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-200 ease-in-out shadow-sm">
            Volver a intentarlo
        </button>
        
        <!-- Opcional: Un enlace sutil para ir al inicio si no quieren volver atrás -->
        <div class="mt-4">
            <a href="/" class="text-sm text-gray-400 hover:text-gray-600 transition duration-150">
                Ir a la página principal
            </a>
        </div>
    </div>

</body>
</html>
