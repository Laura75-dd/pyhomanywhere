<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Cliente | SmartDayz</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::selection { background-color: #9333ea; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden bg-slate-900 text-gray-800">

    <div class="fixed inset-0 z-[-2] bg-[url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center bg-no-repeat fixed"></div>
    <div class="fixed inset-0 z-[-1] bg-slate-900/70 backdrop-blur-md"></div>

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden z-[-1] pointer-events-none">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-700 rounded-full mix-blend-screen filter blur-[120px] opacity-40 animate-blob"></div>
        <div class="absolute top-40 right-1/4 w-[30rem] h-[30rem] bg-fuchsia-800 rounded-full mix-blend-screen filter blur-[120px] opacity-30 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-800 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob animation-delay-4000"></div>
    </div>

    <nav class="sticky top-0 z-50 bg-black/30 backdrop-blur-md border-b border-white/10 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <a href="{% url 'home' %}" class="p-2 bg-white/10 hover:bg-white/20 rounded-xl text-white transition-colors shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    </a>
                    <span class="text-xl font-bold text-white tracking-tight ml-2 drop-shadow-md">Volver al Home</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 py-12">
        <div class="relative w-full max-w-3xl">
            
            <div class="relative bg-[#714b87]/95 backdrop-blur-2xl rounded-3xl shadow-2xl overflow-hidden border border-[#9333ea]/40">
                
                <div class="bg-gradient-to-r from-[#3b0764] to-[#4c1d95] px-8 py-8 relative border-b border-[#28044a]">
                    <div class="flex items-center gap-4">
                        <div class="p-4 bg-white/10 rounded-2xl backdrop-blur-sm shadow-inner border border-white/20">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold tracking-tight text-white drop-shadow-md">Registrar Nuevo Cliente</h2>
                            <p class="text-[#e9d5ff] text-sm mt-1">Ingresa los datos de contacto del cliente para futuras ventas y pedidos.</p>
                        </div>
                    </div>
                </div>

                <div class="p-8">
                    <form id="cliente-form" method="POST" class="space-y-6">
                        {% csrf_token %}
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-[#e9d5ff] uppercase tracking-widest mb-2 ml-1">Nombre Completo *</label>
                                <input type="text" name="nombre" required value="{{ form.nombre.value|default_if_none:'' }}" class="w-full bg-[#f3e8ff] text-[#3b0764] text-sm rounded-xl border-2 border-transparent px-4 py-3 placeholder-[#a855f7] transition-all focus:outline-none focus:bg-white focus:border-[#4c1d95] focus:ring-4 focus:ring-[#4c1d95]/40 shadow-inner" placeholder="Ej. Juan Pérez">
                                {% if form.nombre.errors %}
                                    <p class="text-red-400 text-xs mt-1">{{ form.nombre.errors.0 }}</p>
                                {% endif %}
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-[#e9d5ff] uppercase tracking-widest mb-2 ml-1">Teléfono *</label>
                                <input type="text" name="telefono" required value="{{ form.telefono.value|default_if_none:'' }}" class="w-full bg-[#f3e8ff] text-[#3b0764] text-sm rounded-xl border-2 border-transparent px-4 py-3 placeholder-[#a855f7] transition-all focus:outline-none focus:bg-white focus:border-[#4c1d95] focus:ring-4 focus:ring-[#4c1d95]/40 shadow-inner" placeholder="Ej. 555-987-6543">
                                {% if form.telefono.errors %}
                                    <p class="text-red-400 text-xs mt-1">{{ form.telefono.errors.0 }}</p>
                                {% endif %}
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#e9d5ff] uppercase tracking-widest mb-2 ml-1">Correo Electrónico (Opcional)</label>
                            <input type="email" name="email" value="{{ form.email.value|default_if_none:'' }}" class="w-full bg-[#f3e8ff] text-[#3b0764] text-sm rounded-xl border-2 border-transparent px-4 py-3 placeholder-[#a855f7] transition-all focus:outline-none focus:bg-white focus:border-[#4c1d95] focus:ring-4 focus:ring-[#4c1d95]/40 shadow-inner" placeholder="cliente@correo.com">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#e9d5ff] uppercase tracking-widest mb-2 ml-1">Dirección Completa (Opcional)</label>
                            <textarea name="direccion" class="w-full bg-[#f3e8ff] text-[#3b0764] text-sm rounded-xl border-2 border-transparent px-4 py-3 placeholder-[#a855f7] transition-all focus:outline-none focus:bg-white focus:border-[#4c1d95] focus:ring-4 focus:ring-[#4c1d95]/40 resize-none shadow-inner" rows="3" placeholder="Calle, Número, Colonia, Ciudad...">{{ form.direccion.value|default_if_none:'' }}</textarea>
                        </div>
                        
                        <div class="pt-6 flex flex-col sm:flex-row gap-4 border-t border-[#9333ea]/30 mt-6">
                            <a href="{% url 'home' %}" class="w-full sm:w-1/3 py-3 px-6 rounded-xl bg-[#4c1d95]/40 border border-[#9333ea]/50 text-[#e9d5ff] font-bold text-center hover:bg-[#4c1d95] hover:text-white transition-all focus:outline-none shadow-sm block">
                                Cancelar
                            </a>
                            <button type="submit" class="w-full sm:w-2/3 py-3 px-6 rounded-xl bg-[#4c1d95] text-white font-bold shadow-lg shadow-[#3b0764]/50 hover:bg-[#3b0764] transform transition-all focus:outline-none focus:ring-4 focus:ring-[#4c1d95]/50 flex justify-center items-center gap-2 border border-[#7e22ce]/50">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                                Guardar Cliente
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ADAPTACIÓN: Script para que envíe los datos al backend de Django
        document.getElementById('cliente-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Pausamos el envío real un segundo
            const form = this;

            Swal.fire({
                title: '<span style="color:#3b0764">Guardando Cliente...</span>',
                html: '<div class="flex justify-center my-4"><div class="animate-spin rounded-full h-10 w-10 border-b-2 border-[#4c1d95]"></div></div>',
                showConfirmButton: false,
                allowOutsideClick: false,
                background: '#f3e8ff',
                customClass: { popup: 'rounded-3xl p-6 border-2 border-[#9333ea]/30 shadow-2xl' },
                timer: 1500
            }).then(() => {

                form.submit();
            });
        });

        tailwind.config = {
            theme: { extend: { animation: { blob: "blob 15s infinite alternate" }, keyframes: { blob: { "0%": { transform: "translate(0px, 0px) scale(1)" }, "50%": { transform: "translate(80px, -50px) scale(1.1)" }, "100%": { transform: "translate(-50px, 80px) scale(0.9)" } } } } }
        }
    </script>
</body>
</html>
